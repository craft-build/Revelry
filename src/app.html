<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("revelry-theme") || "system";
          var resolved;
          if (theme === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: light)")
              .matches
              ? "light"
              : "dark";
          } else {
            resolved = theme;
          }
          document.documentElement.classList.add(resolved);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/favicon.png"
    />
    <link
      rel="shortcut icon"
      href="%sveltekit.assets%/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Revelry — Immersive AI roleplay for the desktop"
    />
    <title>Revelry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-background text-foreground antialiased"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
